  <defs>
    <style>
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: bold; font-size: 18px; fill: #1D3557; }
      .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #457B9D; }
      .box { fill: #F8F9FA; stroke: #2E4374; stroke-width: 2; rx: 6; }
      .box-highlight { fill: #EBF2FA; stroke: #1D3557; stroke-width: 2.5; rx: 6; }
      .header-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: bold; font-size: 13px; fill: #1D3557; }
      .body-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #333333; }
      .arrow { stroke: #2E4374; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .tag { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #FFFFFF; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E4374" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF" />

  <text x="30" y="35" class="title">Olist Relational Architecture and Data Pipeline</text>
  <text x="30" y="55" class="subtitle">9-Table Relational Schema Integration to Order-Grain Analytical Master Table</text>

  <g transform="translate(30, 80)">
    <rect width="200" height="85" class="box" />
    <rect width="200" height="24" fill="#1D3557" rx="5" />
    <text x="10" y="16" class="tag">orders (99,441)</text>
    <text x="10" y="42" class="body-text">- order_id (PK)</text>
    <text x="10" y="58" class="body-text">- customer_id (FK)</text>
    <text x="10" y="74" class="body-text">- timestamps (carrier, delivery)</text>
  </g>

  <g transform="translate(30, 185)">
    <rect width="200" height="80" class="box" />
    <rect width="200" height="24" fill="#457B9D" rx="5" />
    <text x="10" y="16" class="tag">order_items (112,650)</text>
    <text x="10" y="42" class="body-text">- order_id, product_id, seller_id</text>
    <text x="10" y="58" class="body-text">- price, freight_value</text>
    <text x="10" y="74" class="body-text">Aggregated to order grain</text>
  </g>

  <g transform="translate(30, 285)">
    <rect width="200" height="80" class="box" />
    <rect width="200" height="24" fill="#457B9D" rx="5" />
    <text x="10" y="16" class="tag">order_payments (103,886)</text>
    <text x="10" y="42" class="body-text">- payment_type, installments</text>
    <text x="10" y="58" class="body-text">- payment_value (total)</text>
    <text x="10" y="74" class="body-text">- primary method identified</text>
  </g>

